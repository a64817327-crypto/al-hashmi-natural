<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Al Hashmi Natural</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 1000px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #0B5D3B; color: white; }
    </style>
</head>
<body style="background: #F5F5E9;">

    <div class="admin-container">
        <h1>🌿 Al Hashmi Natural - Admin Orders Panel</h1>
        <p>Aapki website par aane wale sare real orders yahan show honge:</p>
        <button onclick="loadOrders()" style="padding: 10px 15px; background: #0B5D3B; color: white; border: none; cursor: pointer; border-radius: 4px; margin-top: 10px;">🔄 Refresh Orders</button>

        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer Name</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Items Ordered</th>
                    <th>Total</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="orders-table-body">
                <tr><td colspan="7">Loading orders...</td></tr>
            </tbody>
        </table>
        
        <br>
        <a href="/" style="color: #0B5D3B; font-weight: bold;">← Back to Main Website</a>
    </div>

    <script>
        async function loadOrders() {
            try {
                const response = await fetch('/api/orders');
                const orders = await response.json();
                const tbody = document.getElementById('orders-table-body');
                tbody.innerHTML = '';

                if (orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7">No orders received yet.</td></tr>';
                    return;
                }

                orders.reverse().forEach((order, index) => {
                    const itemsText = order.items.map(i => `${i.name} (x${i.qty})`).join(', ');
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>#${orders.length - index}</td>
                        <td><strong>${order.customerName}</strong></td>
                        <td>${order.phone}</td>
                        <td>${order.address}, ${order.city}</td>
                        <td>${itemsText}</td>
                        <td><strong>Rs. ${order.totalAmount}</strong></td>
                        <td><small>${order.orderDate}</small></td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error("Error loading orders:", err);
            }
        }

        loadOrders();
    </script>
</body>
</html>
